name: Withdraw 2.1.0 Release
on:
  push:
    branches: [feature/table-ui-redesign]
    paths: ['.github/workflows/withdraw-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Remove published 2.1.0 release while preserving source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete 2.1.0 --yes
