name: Release

on:
  push:
    tags:
      - '[0-9]*'

env:
  JAVA_VERSION: '21'
  JAVA_DIST: 'liberica'

jobs:
  build-and-release:
    name: Build All Formats and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Versioning Logic
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $displayVersion = $tag
          
          $parts = $tag -split '[-.]'
          $major = $parts[0]
          $minor = $parts[1]
          $patch = $parts[2]
          
          $lastChar = $tag.Substring($tag.Length - 1).ToLower()
          if ($lastChar -match "[a-z]") {
              $letterValue = [int][char]$lastChar - 96
              $serVersion = "$major.$minor.$patch.$letterValue"
          } else {
              $serVersion = "$major.$minor.$patch"
          }
          
          Write-Host "Display Version: $displayVersion"
          Write-Host "Serial Version: $serVersion"
          
          "APP_DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_SERIAL_VERSION=$serVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          architecture: x64
          cache: 'maven'

      - name: Install Build Tools (WiX & Enigma)
        shell: pwsh
        run: |
          function Install-ReleaseTool([string[]]$Arguments) {
            $log = & choco @Arguments 2>&1
            $code = $LASTEXITCODE
            $log | Write-Host
            if ($code -notin @(0, 1641, 3010)) {
              $detail = (($log | Select-Object -Last 20) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Release tool installation failed::$detail"
              throw "Chocolatey failed with exit code $code"
            }
          }
          Install-ReleaseTool @('install', 'wixtoolset', '--version=3.14.1.20250415', '-y')
          # Chocolatey's Enigma 9.20 metadata points to a mutable upstream URL.
          # Use the official installer only after Windows validates its signature.
          $installer = Join-Path $env:RUNNER_TEMP 'enigmavb.exe'
          Invoke-WebRequest 'https://enigmaprotector.com/assets/files/enigmavb.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "Official Enigma installer signature is not valid: $($signature.Status) ($($signature.StatusMessage))"
          }
          Write-Host "Verified installer publisher: $($signature.SignerCertificate.Subject)"
          Get-FileHash $installer -Algorithm SHA256
          $install = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Enigma installer failed: $($install.ExitCode)" }
          if (-not (Test-Path 'C:/Program Files (x86)/Enigma Virtual Box/enigmavbconsole.exe')) {
            throw 'Enigma console executable was not installed at the expected path'
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}/WiX Toolset v3*/bin/candle.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX v3 candle.exe not found' }
          $wix.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Update POM and Build
        shell: pwsh
        run: |
          mvn versions:set "-DnewVersion=${{ env.APP_SERIAL_VERSION }}" -DgenerateBackupPoms=false
          mvn clean package -DskipTests "-Dapp.semantic.version=${{ env.APP_SERIAL_VERSION }}" "-Dapp.display.version=${{ env.APP_DISPLAY_VERSION }}"

      - name: Execute Packaging Scripts
        shell: pwsh
        env:
          APP_DISPLAY_VERSION: ${{ env.APP_DISPLAY_VERSION }}
          APP_SERIAL_VERSION: ${{ env.APP_SERIAL_VERSION }}
          MSI_WIN_UPGRADE_UUID: ${{ secrets.MSI_WIN_UPGRADE_UUID }}
        run: |
          Write-Host "Starting Multi-format Packaging for version $env:APP_DISPLAY_VERSION..." -ForegroundColor Magenta
          
          "jar", "zip", "exe", "msi", "msix" | ForEach-Object {
              Write-Host "--> Packaging format: $_" -ForegroundColor Cyan
              ./.build/build.ps1 -Type $_
          }

      - name: Verify all release artifacts
        shell: pwsh
        run: |
          $version = $env:APP_DISPLAY_VERSION
          foreach ($format in @('jar', 'zip', 'exe', 'msi', 'msix')) {
            $path = "output/MouseMacros-$version.$format"
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release artifact: $path" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty release artifact: $path" }
            Get-FileHash $path -Algorithm SHA256
          }

      - name: Generate Changelog
        id: changelog_gen
        shell: pwsh
        run: |
          $jsonPath = "mousemacros-app/src/main/resources/io/github/samera2022/mousemacros/updates.json"
          $ver = "${{ env.APP_DISPLAY_VERSION }}"
          $logFile = "release_body.txt"
          
          if (Test-Path $jsonPath) {
              $updates = Get-Content $jsonPath -Raw | ConvertFrom-Json
              $entry = $updates."$ver"
              if ($entry) {
                  $body = "[$($entry.releaseDate)] $ver`n`n$($entry.description)"
                  [System.IO.File]::WriteAllLines("$(Get-Location)/$logFile", $body, (New-Object System.Text.UTF8Encoding $False))
                  return
              }
          }
          "Release for version $ver" | Out-File -FilePath $logFile -Encoding utf8

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_DISPLAY_VERSION }}
          body_path: release_body.txt
          draft: false
          prerelease: ${{ contains(env.APP_DISPLAY_VERSION, '-') }}
          files: |
            output/*.jar
            output/*.zip
            output/*.exe
            output/*.msi
            output/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}